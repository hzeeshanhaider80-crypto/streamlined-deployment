# HTTP site config (used until the SSL certificate exists)
upstream app_backend {
    server app:3000;          # 'app' = service name in docker-compose.yml
    keepalive 32;             # reuse connections to the app
}

server {
    listen 80;
    server_name _;            # any hostname

    # Details passed to the app with every request
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Let's Encrypt domain-ownership check
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    # Health checks: don't fill the logs
    location = /health { access_log off; proxy_pass http://app_backend; }
    location = /ready  { access_log off; proxy_pass http://app_backend; }
    # API with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://app_backend;
    }
    # Everything else
    location / {
        proxy_pass http://app_backend;
    }
}
