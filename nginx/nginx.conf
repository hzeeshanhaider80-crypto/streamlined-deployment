# Global Nginx settings
user  nginx;                                # run workers as the 'nginx' user
worker_processes  auto;                     # one worker per CPU core
error_log  /var/log/nginx/error.log warn;   # log warnings and errors
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;               # max connections per worker
}

http {
    include       /etc/nginx/mime.types;    # file type → content type
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_user_agent" rt=$request_time';
    access_log  /var/log/nginx/access.log  main;

    sendfile           on;                  # fast file sending
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;                  # keep browser connections open 65 s
    server_tokens      off;                 # hide the Nginx version
    client_max_body_size 10m;               # max upload size

    gzip              on;                   # compress responses
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types        text/plain text/css application/json application/javascript image/svg+xml;

    # Rate limit: 10 requests/second per visitor IP (applied to /api/)
    limit_req_zone  $binary_remote_addr  zone=api_limit:10m  rate=10r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;       # load the site config
}
